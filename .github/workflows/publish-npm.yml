name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish from, for example v0.0.2.
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish @falsefalse/prettier-plugin-handlebars
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Update npm for trusted publishing
        # Trusted publishing needs npm >= 11.5.1, which Node 24 does not guarantee.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify the tag matches package.json
        env:
          # On a tag push inputs.tag is empty and ref_name is the tag; on a manual
          # dispatch ref_name is the branch and inputs.tag carries the tag.
          # Pass though env so tag itself doesn't get executed by the shell.
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag $TAG does not match package.json version $VERSION"
            echo "expected v$VERSION"
            exit 1
          fi

      - name: Run package checks
        run: npm run check

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --provenance
