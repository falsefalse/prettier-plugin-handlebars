name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }} / Prettier ${{ matrix.prettier-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20"
          - "22"
          - "24"
          - "26"
        prettier-version:
          - "3.0"
          - "3.2"
          - latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install matrix Prettier
        # npm 10.9.8 (bundled with Node 22) can crash while replacing a peer
        # dependency in an existing tree. The matrix supplies Prettier explicitly.
        run: npm install --no-save --package-lock=false --legacy-peer-deps prettier@${{ matrix.prettier-version }}

      - name: Versions
        run: |
          node --version; npm --version
          node -p -e "require('prettier/package.json').version"

      - name: Build and test
        run: npm run build && npm test

      - name: Typecheck and gates
        # The gates import `test/lib/*.mts`, which needs node's type stripping:
        # unflagged from 22.18, so every line here but 20 has it.
        if: matrix.node-version != '20'
        run: npm run typecheck && npm run gates
